name: ci

on:
  push:
    paths:
      - "docs/**"
      - "**/*.md"
      - "scripts/check-links.py"
      - ".github/workflows/ci.yml"
  pull_request:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Relative links resolve
        run: python3 scripts/check-links.py .
